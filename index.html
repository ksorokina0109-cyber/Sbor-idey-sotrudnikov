<!DOCTYPE html>
<html lang="ru">
<head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Разогнать идею — Эврика</title>
<style>
:root{
  --deep:#12305C;
  --ink:#0F1E33;
  --paper:#F6F2EA;
  --card:#FFFFFF;
  --amber:#E07B1E;
  --amber-soft:#FDF0DF;
  --line:#E2DACD;
  --muted:#6B7A8D;
  --ok:#1F7A52;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Golos Text","Segoe UI",Roboto,-apple-system,sans-serif;
  font-size:17px;line-height:1.45;
  display:flex;flex-direction:column;min-height:100dvh;
}

/* ── шкала силы ─────────────────── */
.meter{
  position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;
  padding:10px 16px 12px;box-shadow:0 2px 10px rgba(15,30,51,.18)
}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;
  max-width:600px;margin:0 auto 7px}
.meter b{font-size:15px;font-weight:600}
.meter em{font-style:normal;font-size:13px;color:#AFC4E2}
.track{max-width:600px;margin:0 auto;height:6px;border-radius:3px;background:#2B4C7E;overflow:hidden}
.track i{display:block;height:100%;width:8%;border-radius:3px;
  background:linear-gradient(90deg,#E07B1E,#F2A94E);transition:width .5s cubic-bezier(.2,.8,.3,1)}

/* ── лента ──────────────────────── */
.feed{flex:1;overflow-y:auto;padding:18px 16px 8px}
.inner{max-width:600px;margin:0 auto}
.msg{display:flex;gap:10px;margin-bottom:14px;align-items:flex-end}
.msg .ava{
  width:36px;height:36px;flex:0 0 36px;border-radius:50%;overflow:hidden;
  background:#2A4E86;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px
}
.msg .ava img{width:100%;height:100%;object-fit:cover}
.bub{
  background:var(--card);border:1px solid var(--line);
  border-radius:18px 18px 18px 5px;padding:12px 15px;max-width:82%;
  animation:pop .32s ease both
}
.msg.me{justify-content:flex-end}
.msg.me .bub{
  background:var(--deep);color:#fff;border-color:var(--deep);
  border-radius:18px 18px 5px 18px
}
.msg.me .ava{display:none}
.bub p{margin:0}
.bub p+p{margin-top:7px}
@keyframes pop{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.dots span{
  display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;
  background:#B9C4D3;animation:blink 1.1s infinite
}
.dots span:nth-child(2){animation-delay:.18s}
.dots span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* ── зона ввода ─────────────────── */
.dock{
  position:sticky;bottom:0;background:var(--paper);
  border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))
}
.dock .inner{max-width:600px;margin:0 auto}
textarea{
  width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--card);
  padding:12px 14px;font:inherit;color:inherit;resize:none;min-height:76px
}
textarea:focus{outline:none;border-color:var(--deep)}
.tools{display:flex;gap:8px;margin-top:9px}
.go{
  flex:1;background:var(--deep);color:#fff;border:0;border-radius:13px;
  padding:14px;font:inherit;font-weight:600;font-size:17px;cursor:pointer
}
.go:disabled{background:#AAB5C4}
.mic{
  background:var(--amber-soft);border:1.5px solid #F0C48C;color:#8A4B06;
  border-radius:13px;padding:0 16px;font-size:19px;cursor:pointer
}
.mic.rec{background:#FCE3E3;border-color:#EFA9A9}
.why{font-size:13px;color:var(--muted);margin:8px 0 0}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips button{
  background:var(--card);border:1.5px solid var(--line);border-radius:999px;
  padding:9px 14px;font:inherit;font-size:15px;cursor:pointer;color:inherit
}
.chips button.sel{background:var(--deep);border-color:var(--deep);color:#fff}

.cards{display:grid;gap:8px;margin-bottom:10px}
.cards button{
  text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:13px 15px;font:inherit;cursor:pointer;color:inherit
}
.cards button b{display:block}
.cards button span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.cards button.sel{border-color:var(--deep);background:#EDF2FA}

/* ── счётчик ────────────────────── */
.counter{
  background:var(--deep);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:14px;
  text-align:center
}
.counter .lab{font-size:13px;color:#AFC4E2;margin:0}
.counter .big{
  font-size:34px;font-weight:700;letter-spacing:-.6px;margin:4px 0 2px;
  font-variant-numeric:tabular-nums
}
.counter .cmp{font-size:14px;color:#F2C48E;margin:0;min-height:20px}
.sl{margin-bottom:13px}
.sl .top{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:5px}
.sl .top b{font-weight:600}
.sl .top i{font-style:normal;color:var(--deep);font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{
  width:100%;-webkit-appearance:none;appearance:none;height:26px;background:none
}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#DDD5C8}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--amber);
  border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);margin-top:-10px
}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#DDD5C8}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border:3px solid #fff;border-radius:50%;background:var(--amber)
}

/* ── итог ───────────────────────── */
.fld{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px}
.fld h3{margin:0 0 7px;font-size:13.5px;font-weight:600;color:var(--deep)}
.fld .txt{white-space:pre-wrap;font-size:16px}
.fld .txt:focus{outline:2px solid #C8D8EE;border-radius:6px}
.copy{
  margin-top:10px;background:var(--amber-soft);border:1.5px solid #F0C48C;color:#8A4B06;
  border-radius:10px;padding:8px 13px;font:inherit;font-size:15px;cursor:pointer
}
.copy.done{background:#DFF3E8;border-color:#9FD3B9;color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* внутри телеграма шкала не липнет к системной шапке */
.in-tg .meter{padding-top:14px}
.in-tg body{background:var(--paper)}
</style>
</head>

</div>

<div class="feed" id="feed"><div class="inner" id="inner"></div></div>

<div class="dock"><div class="inner" id="dock"></div></div>

/* ───── состояние ───── */
var A={q1:'',q2:'',q3:'',q4:'',q5:'',kind:null,one:10,week:5,ppl:1,cost:0};
var UNITS={time:'мин',money:'₽',risk:'случ.',qual:'мин'};
var TYPES={time:'Косвенный экономический',money:'Прямой экономический',
           risk:'Сокращение рисков',qual:'Качественный'};
var feed=document.getElementById('feed'),inner=document.getElementById('inner'),dock=document.getElementById('dock');

function scroll(){feed.scrollTop=feed.scrollHeight}
function ava(){return '<div class="ava"><img src="'+FACE+'" alt="Эврика"></div>'}

function say(html,cb){
  var t=document.createElement('div');
  t.className='msg';
  t.innerHTML=ava()+'<div class="bub dots"><span></span><span></span><span></span></div>';
  inner.appendChild(t);scroll();
  setTimeout(function(){
    t.innerHTML=ava()+'<div class="bub">'+html+'</div>';
    scroll(); if(cb)cb();
  },520);
}
function me(text){
  var d=document.createElement('div');
  d.className='msg me';
  d.innerHTML='<div class="bub"><p></p></div>';
  d.querySelector('p').textContent=text;
  inner.appendChild(d);scroll();
}

/* ───── шкала силы ───── */
function hasNum(s){return /\d/.test(s)}
function strength(){
  var p=6;
  if(A.q1)p+=A.q1.length>25?14:8;
  if(A.q2)p+=12;
  if(A.q3)p+=A.q3.length>25?16:9;
  if(A.q4)p+=A.q4.length>20?16:9;
  if(A.q5)p+=10;
  if(hasNum(A.q1+A.q2+A.q3+A.q5))p+=8;
  if(A.kind)p+=8;
  if(A.one&&A.week)p+=18;
  return Math.min(p,100);
}
function paint(){
  var p=strength(),n,t;
  if(p<25){n='Пока просто мысль';t='Расскажите подробнее'}
  else if(p<50){n='Уже похоже на идею';t='Не хватает конкретики'}
  else if(p<72){n='Есть суть и решение';t='Осталось посчитать эффект'}
  else if(p<92){n='Крепкая идея';t='Почти готова к подаче'}
  else{n='Готова к подаче';t='С расчётом — такие принимают'}
  document.getElementById('m-fill').style.width=p+'%';
  document.getElementById('m-name').textContent=n;
  document.getElementById('m-tip').textContent=t;
}

/* ───── реакции Эврики ───── */
function react(key,val){
  var v=val.toLowerCase();
  if(key==='q1'){
    if(hasNum(v))return 'Уже с цифрой — люблю такое.';
    if(val.length<25)return 'Коротко. Ладно, детали вытяну по ходу.';
    return 'Понятно, картина складывается.';
  }
  if(key==='q2'){
    if(/несколько раз|смен|в день|ежедн|кажд|постоянно|всегда/.test(v))
      return 'Так часто — значит это не мелочь, а системная штука. Такие идеи принимают охотнее.';
    if(/недел/.test(v))return 'За год из этого набегает прилично. Скоро посчитаем сколько.';
    if(/месяц|редк|иногда|квартал/.test(v))return 'Пусть редко — если каждый раз дорого обходится, эффект всё равно будет.';
    return 'Записала. Идём дальше.';
  }
  if(key==='q3'){
    if(val.length>60)return 'Вот это ценно. То, как вы выкручиваетесь сейчас, — и есть описание задачи. Сама бы не придумала.';
    return 'Ага, поняла. Это и есть та самая задача, которую надо решить.';
  }
  if(key==='q4')return 'Годится. Это и пойдёт в поле «мероприятия» — вашими словами, не моими.';
  if(key==='q5')return 'Отлично. Остался самый важный кусок.';
  return '';
}

/* ───── ввод: текст ───── */
function askText(key,question,hint,ph,next){
  say('<p>'+question+'</p>'+(hint?'<p style="color:#6B7A8D;font-size:15px">'+hint+'</p>':''));
  dock.innerHTML=
    '<textarea id="in" placeholder="'+ph+'"></textarea>'+
    '<div class="tools"><button class="mic" id="mic">🎤</button>'+
    '<button class="go" id="ok" disabled>Ответить</button></div>'+
    '<p class="why" id="why"></p>';
  var box=document.getElementById('in'),ok=document.getElementById('ok');
  box.oninput=function(){ok.disabled=box.value.trim().length<3};
  setupMic(box);
  ok.onclick=function(){
    A[key]=box.value.trim(); me(A[key]); paint();
    var r=react(key,A[key]);
    dock.innerHTML='';
    if(r)say('<p>'+r+'</p>',function(){setTimeout(next,300)});
    else next();
  };
}

/* ───── ввод: чипсы ───── */
function askChips(key,question,opts,next){
  say('<p>'+question+'</p>');
  var h='<div class="chips">';
  opts.forEach(function(o,i){h+='<button data-i="'+i+'">'+o+'</button>'});
  h+='</div><textarea id="in" placeholder="или напишите по-своему"></textarea>'+
     '<div class="tools"><button class="go" id="ok" disabled>Ответить</button></div>';
  dock.innerHTML=h;
  var box=document.getElementById('in'),ok=document.getElementById('ok'),chosen='';
  dock.querySelectorAll('.chips button').forEach(function(b){
    b.onclick=function(){
      dock.querySelectorAll('.chips button').forEach(function(x){x.classList.remove('sel')});
      b.classList.add('sel');chosen=b.textContent;ok.disabled=false;
    };
  });
  box.oninput=function(){
    if(box.value.trim()){chosen='';dock.querySelectorAll('.chips button').forEach(function(x){x.classList.remove('sel')})}
    ok.disabled=!(box.value.trim()||chosen);
  };
  ok.onclick=function(){
    A[key]=box.value.trim()||chosen; me(A[key]); paint();
    var r=react(key,A[key]); dock.innerHTML='';
    if(r)say('<p>'+r+'</p>',function(){setTimeout(next,300)});else next();
  };
}

/* ───── ввод: тип эффекта ───── */
function askKind(next){
  say('<p>Теперь главное. Идеи чаще всего отклоняют не потому, что они плохие, а потому что не посчитан эффект.</p>'+
      '<p>Сейчас посчитаем вместе. Что ваша идея экономит?</p>');
  dock.innerHTML=
    '<div class="cards">'+
    '<button data-k="time"><b>Время людей</b><span>Косвенный экономический</span></button>'+
    '<button data-k="money"><b>Прямые деньги</b><span>Прямой экономический</span></button>'+
    '<button data-k="risk"><b>Снижает риск</b><span>Сокращение рисков</span></button>'+
    '<button data-k="qual"><b>Просто станет удобнее</b><span>Качественный</span></button>'+
    '</div>';
  dock.querySelectorAll('.cards button').forEach(function(b){
    b.onclick=function(){
      A.kind=b.dataset.k; me(b.querySelector('b').textContent); paint();
      dock.innerHTML=''; next();
    };
  });
}

/* ───── ввод: ползунки ───── */
function askNums(next){
  var noun=A.kind==='money'?'рублей':(A.kind==='risk'?'случаев':'минут');
  say('<p>Двигайте ползунки — я считаю на ходу. Точность до единицы не нужна, важен порядок.</p>');
  dock.innerHTML=
    '<div class="counter"><p class="lab">Эффект за год</p>'+
    '<p class="big" id="c-big">—</p><p class="cmp" id="c-cmp"></p></div>'+
    slider('one',noun+' за один раз',
      A.kind==='money'?0:1,
      A.kind==='money'?5000:120,
      A.kind==='money'?50:1,
      A.kind==='money'?200:10)+
    slider('week','раз в неделю',1,40,1,5)+
    slider('ppl','человек это касается',1,50,1,1)+
    (A.kind==='money'||A.kind==='time'?slider('cost','рублей на внедрение',0,500000,5000,0):'')+
    '<div class="tools"><button class="go" id="ok">Собрать идею</button></div>';
  ['one','week','ppl','cost'].forEach(function(k){
    var el=document.getElementById('s-'+k); if(!el)return;
    el.oninput=function(){A[k]=+el.value;document.getElementById('v-'+k).textContent=(+el.value).toLocaleString('ru');calc();paint()};
  });
  calc();
  document.getElementById('ok').onclick=function(){
    me('Посчитала: '+document.getElementById('c-big').textContent);
    dock.innerHTML=''; next();
  };
}
function slider(k,label,min,max,step,val){
  A[k]=val;
  return '<div class="sl"><div class="top"><b>'+label+'</b><i id="v-'+k+'">'+val.toLocaleString('ru')+'</i></div>'+
    '<input type="range" id="s-'+k+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"></div>';
}

/* ───── расчёт ───── */
function result(){
  var per=A.one*A.week*A.ppl*48, big='', cmp='', form='';
  if(A.kind==='time'||A.kind==='qual'){
    var h=Math.round(per/60);
    big=h.toLocaleString('ru')+' часов в год';
    cmp=h>7?'это примерно '+Math.round(h/8)+' рабочих дней одного человека':'';
    form=A.one+' мин × '+A.week+' раз в неделю × '+A.ppl+' чел. × 48 недель = '+per.toLocaleString('ru')+' минут';
  }else if(A.kind==='money'){
    var net=per-A.cost;
    big=net.toLocaleString('ru')+' ₽ в год';
    cmp=A.cost?'уже за вычетом '+A.cost.toLocaleString('ru')+' ₽ на внедрение':'';
    form=A.one+' ₽ × '+A.week+' раз в неделю × '+A.ppl+' чел. × 48 недель − '+A.cost.toLocaleString('ru')+' ₽';
  }else{
    big=per.toLocaleString('ru')+' случаев в год';
    cmp='столько раз в год срабатывает риск';
    form=A.one+' × '+A.week+' раз в неделю × '+A.ppl+' чел. × 48 недель';
  }
  return {big:big,cmp:cmp,form:form};
}
function calc(){
  var r=result();
  document.getElementById('c-big').textContent=r.big;
  document.getElementById('c-cmp').textContent=r.cmp;
}

/* ───── финал ───── */
function finish(){
  var r=result();
  var name=A.q4.replace(/^(нужно|надо|давайте|сделать|чтобы)\s+/i,'');
  name=name.charAt(0).toUpperCase()+name.slice(1);
  if(name.length>70)name=name.slice(0,70).replace(/\s+\S*$/,'')+'…';

  var f={
    'Название':name,
    'Описание':A.q1+'\nПроисходит: '+A.q2.toLowerCase()+'.',
    'Задача':'Сейчас: '+A.q3+'\nЗадача — устранить эту необходимость.',
    'Мероприятия':A.q4,
    'Тип и ожидаемый эффект':'Тип: '+TYPES[A.kind]+'\n'+A.q5+'\nРасчёт: '+r.form+'\nИтого: '+r.big+'.'
  };
  say('<p>Готово. Ваша идея тянет на <b>'+r.big+'</b>.</p>'+
      '<p>Проверьте текст, поправьте прямо в полях — и отправьте одной кнопкой.</p>');
  var h='';
  Object.keys(f).forEach(function(k,i){
    h+='<div class="fld"><h3>'+k+'</h3><div class="txt" contenteditable id="t'+i+'"></div></div>';
  });
  h+='<div class="tools" style="flex-direction:column;gap:9px">'+
     (TG
       ? '<button class="go" id="all">📋 Скопировать идею</button>'+
         '<button class="copy" id="send" style="margin:0;padding:13px">✉️ Отправить письмом</button>'
       : '<button class="go" id="send">✉️ Отправить идею</button>'+
         '<button class="copy" id="all" style="margin:0;padding:13px">Скопировать весь текст</button>')+
     '<button class="copy" style="margin:0;padding:13px;background:#fff;border-color:#E2DACD;color:#6B7A8D" '+
     'onclick="location.reload()">Оформить ещё одну</button></div>'+
     '<p class="why" style="text-align:center">'+
     (TG?'Скопируйте и вставьте на портал инициатив или отправьте Эврике в чат.'
        :'Откроется ваша почта с готовым письмом. Останется нажать «Отправить».')+'</p>';
  var box=document.createElement('div');box.className='msg';box.innerHTML='<div style="width:100%">'+h+'</div>';
  inner.appendChild(box);
  Object.keys(f).forEach(function(k,i){document.getElementById('t'+i).textContent=f[k]});

  function collect(){
    var out=[];
    Object.keys(f).forEach(function(k,i){
      out.push(k.toUpperCase()+'\n'+document.getElementById('t'+i).textContent);
    });
    if(WHO)out.push('АВТОР\n'+WHO);
    return out.join('\n\n');
  }
  function copyText(t){
    if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);
    return new Promise(function(res,rej){
      var a=document.createElement('textarea');
      a.value=t;a.style.position='fixed';a.style.opacity=0;
      document.body.appendChild(a);a.select();
      try{document.execCommand('copy');res()}catch(e){rej(e)}
      document.body.removeChild(a);
    });
  }
  document.getElementById('send').onclick=function(){
    var subj='Идея: '+document.getElementById('t0').textContent;
    var url='mailto:'+MAIL+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(collect());
    if(TG&&TG.openLink){TG.openLink(url)}else{location.href=url}
  };
  document.getElementById('all').onclick=function(){
    var b=this,orig=b.textContent;
    copyText(collect()).then(function(){
      b.textContent='Скопировано';b.classList.add('done');
      if(TG&&TG.HapticFeedback)TG.HapticFeedback.notificationOccurred('success');
      setTimeout(function(){b.textContent=orig;b.classList.remove('done')},1700);
    });
  };
  dock.innerHTML='';scroll();
}

/* ───── микрофон ───── */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function setupMic(box){
  var b=document.getElementById('mic'),why=document.getElementById('why');
  if(!b)return;
  if(!SR){b.style.display='none';return}
  if(location.protocol!=='https:'&&location.hostname!=='localhost'){
    why.textContent='Микрофон заработает, когда страница будет открыта по https.';
  }
  var rec=null;
  b.onclick=function(){
    if(rec){rec.stop();return}
    rec=new SR();rec.lang='ru-RU';rec.continuous=true;rec.interimResults=false;
    rec.onstart=function(){b.classList.add('rec');why.textContent='Говорите.'};
    rec.onresult=function(e){
      for(var i=e.resultIndex;i<e.results.length;i++)
        box.value=(box.value?box.value+' ':'')+e.results[i][0].transcript;
      box.dispatchEvent(new Event('input'));
    };
    rec.onerror=function(e){
      why.textContent=e.error==='not-allowed'?'Микрофон запрещён — разрешите доступ в браузере.':
        (e.error==='no-speech'?'Ничего не услышала.':'Не вышло: '+e.error);
    };
    rec.onend=function(){rec=null;b.classList.remove('rec')};
    try{rec.start()}catch(err){rec=null}
  };
}

/* ───── сценарий ───── */
function start(){
  say('<p>Заметили неудобство, а оформить в идею рука не поднимается? Знакомо.</p>'+
      '<p>Давайте разберём вместе. Я задам несколько вопросов про вашу работу и соберу из ваших же слов готовое предложение — с расчётом.</p>'+
      '<p style="color:#6B7A8D;font-size:15px">Ничего никуда не отправляется.</p>');
  dock.innerHTML='<div class="tools"><button class="go" id="ok">Поехали</button></div>';
  document.getElementById('ok').onclick=function(){
    me('Поехали');dock.innerHTML='';
    setTimeout(s1,300);
  };
}
function s1(){askText('q1','Что неудобно?','Своими словами, как есть. Формулировки — моя забота.',
  'например: чтобы отметить приёмку, иду в другой корпус за подписью',s2)}
function s2(){askChips('q2','Как часто это случается?',
  ['Несколько раз за смену','Каждую смену','Раз в неделю','Раз в месяц'],s3)}
function s3(){askText('q3','А как вы сейчас выкручиваетесь?','Что делаете, когда это происходит? Здесь обычно и прячется суть.',
  'например: коплю накладные и иду один раз в конце смены',s4)}
function s4(){askText('q4','Как было бы правильно?','Что конкретно изменить. Даже если кажется очевидным.',
  'например: дать кладовщику право подписи до 50 тысяч',s5)}
function s5(){askText('q5','Кому и в чём станет легче?','',
  'например: данные попадают в систему в тот же день',s6)}
function s6(){askKind(s7)}
function s7(){askNums(finish)}

paint();start();
</script>
